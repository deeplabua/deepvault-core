[package]
name = "deepvault-vault"
version = "0.25.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The .dvault format (v1, v2 with files outside the vault file): Argon2id key slots, HKDF subkeys, XChaCha20-Poly1305 entries and chunked files. Bytes in, bytes out."

[lib]
name = "vault"

[features]
# Deterministic randomness and clock, and KDF parameters below the production minimum.
# For test vectors only: never enabled by core-ffi (and so never in the app).
testing = []

[dependencies]
argon2.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
hmac.workspace = true
sha2.workspace = true
sha1.workspace = true
zeroize.workspace = true
getrandom.workspace = true
ed25519-dalek.workspace = true
serde.workspace = true
ciborium.workspace = true
aes.workspace = true
cbc.workspace = true
chacha20.workspace = true
salsa20.workspace = true
flate2.workspace = true
quick-xml.workspace = true
p256.workspace = true
rsa.workspace = true

[dev-dependencies]
deepvault-vault = { path = ".", features = ["testing"] }
serde_json.workspace = true
p256.workspace = true
rsa.workspace = true
sha2.workspace = true
