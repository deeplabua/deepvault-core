# DeepVault's open core: the `.dvault` file format, the key hierarchy (Argon2id, HKDF,
# XChaCha20-Poly1305) and the entries. The app pulls `deepvault-vault` in as a git
# dependency pinned to a release tag and exports it to Swift itself (UniFFI lives there).
#
# No network and no file system: the core takes and returns bytes. Every dependency is
# listed in ADR-0001 (docs/architecture/adr in the app repo); a new one needs an ADR.
[workspace]
members = ["crates/vault"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
hkdf = "0.13"
hmac = "0.13"
sha2 = { version = "0.11", default-features = false }
# TOTP only (RFC 6238 defaults to HMAC-SHA1); never for the vault's own keys.
sha1 = { version = "0.11", default-features = false }
zeroize = { version = "1.9", features = ["derive"] }
getrandom = "0.4"
# SSH ed25519 keys for the agent (ADR-0006): signing only, keys made from our own randomness.
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }
# KeePass KDBX import and export (ADR-0008): outer ciphers, KDBX 3.1's AES-KDF and inner
# stream, gzip (pure Rust), the XML inside.
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
chacha20 = "0.10"
salsa20 = "0.11"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
quick-xml = "0.42"
# Passkeys (ADR-0010): ECDSA P-256 / SHA-256, signed inside the core.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "arithmetic", "alloc"] }
# RSA SSH keys, imported only, for old servers (ADR-0011): PKCS#1 v1.5 signing with SHA-256/512.
rsa = { version = "=0.10.0-rc.19", default-features = false, features = ["sha2"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
ciborium = "0.2"
serde_json = "1"

# Argon2 in a debug build is ~50× slower; tests and debug app builds keep it usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
